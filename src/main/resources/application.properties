# ============================================================
#  Courier & Logistics Tracking System — Application Config
# ============================================================

# Server (Dynamic port for Render/Railway, fallback to 8088 for local)
server.port=${PORT:8088}

# ── PostgreSQL DataSource ─────────────────────────────────
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:${PGHOST:localhost}}:${DB_PORT:${PGPORT:5432}}/${DB_NAME:${PGDATABASE:LogisticAndTrack_db}}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:${PGUSER:postgres}}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:${PGPASSWORD:Pandey01@}}}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate ──────────────────────────────────────
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Naming Strategy ──────────────────────────────────────
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# ── DevTools ─────────────────────────────────────────────
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true

# ── Logging ──────────────────────────────────────────────
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
